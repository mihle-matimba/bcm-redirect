<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Crown Markets has a new platform</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; text-align: center;
      background: #0a0a0a; color: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 0 0 12px; }
    p { color: #a3a3a3; margin: 0 0 24px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 24px; border-radius: 50%;
      border: 3px solid #333; border-top-color: #d4af37;
      animation: spin 0.9s linear infinite;
    }
    a { color: #d4af37; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Black Crown Markets has a new platform</h1>
    <p>Taking you to the new login page…</p>
    <a id="continue" href="https://register.blackcrownmarkets.com/register">Click here if you aren't redirected</a>
  </main>
  <script src="/redirect.js"></script>
</body>
</html>
