<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Black Crown Markets has a new platform</title>
  <style>
    :root { color-scheme: dark; --purple: #6d3ff0; --purple-light: #8b5cf6; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      text-align: center; overflow: hidden; position: relative;
      background:
        radial-gradient(ellipse 70% 45% at 50% 105%, rgba(109,63,240,.55), transparent 70%),
        radial-gradient(ellipse 120% 60% at 50% -25%, rgba(109,63,240,.45), transparent 65%),
        #05030c;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* planet horizon glow */
    body::before {
      content: ""; position: absolute; left: 50%; top: 14%;
      width: 150vmax; height: 150vmax; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 0%, rgba(139,92,246,.35), rgba(30,15,80,.5) 30%, #05030c 60%);
      border-top: 2px solid rgba(167,139,250,.55);
      box-shadow: 0 -10px 80px rgba(109,63,240,.6);
      z-index: 0;
    }
    header { position: absolute; top: 32px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1; }
    header img { height: 44px; width: auto; }
    main { position: relative; z-index: 1; max-width: 720px; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -.02em;
      line-height: 1.1; margin: 0 0 16px;
    }
    h1 span { color: var(--purple-light); }
    p { color: #cfc8e6; font-size: clamp(1rem, 2.2vw, 1.2rem); margin: 0 0 32px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 28px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15); border-top-color: var(--purple-light);
      animation: spin .9s linear infinite;
    }
    .btn {
      display: inline-block; padding: 16px 36px; border-radius: 999px;
      background: var(--purple); color: #fff; font-weight: 700; text-decoration: none;
      box-shadow: 0 8px 30px rgba(109,63,240,.5); transition: background .2s;
    }
    .btn:hover { background: var(--purple-light); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <img src="https://ffxlryusmstnfjedleds.supabase.co/storage/v1/object/public/Assets/blackcrown%20white.svg" alt="Black Crown Markets">
  </header>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Black Crown Markets <span>has a new platform</span></h1>
    <p>Taking you to <span data-dest-label>the new login page</span>…</p>
    <a id="continue" class="btn" href="https://register.blackcrownmarkets.com/login">Continue</a>
  </main>
  <script src="/redirect.js"></script>
</body>
</html>
